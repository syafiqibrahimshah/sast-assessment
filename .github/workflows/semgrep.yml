name: Semgrep

on:
  # Diff-aware scan for pull requests.
  pull_request: {}

  # Full scan when changes reach the main branch.
  push:
    branches:
      - main

  # Allow manual execution from GitHub Actions.
  workflow_dispatch: {}

  # Periodic full scan to catch newly published rules/vulnerabilities.
  schedule:
    - cron: "23 17 * * *"

permissions:
  contents: read

jobs:
  semgrep:
    name: semgrep/ci
    runs-on: ubuntu-latest

    container:
      image: semgrep/semgrep

    # Avoid permission issues with Dependabot PRs.
    if: github.actor != 'dependabot[bot]'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run Semgrep CI
        run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}