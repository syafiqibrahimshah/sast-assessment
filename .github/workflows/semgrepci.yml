name: SAST (Semgrep)

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Blocking gate: diff-scoped on PRs into main.
  # Blocking vs. non-blocking severity is configured via rule policies
  # in Semgrep AppSec Platform, not in this workflow.
  diff-scan:
    name: Semgrep (diff-scoped, blocking)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    container:
      image: semgrep/semgrep:1.174.0
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - run: semgrep ci
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

  # Non-blocking: full-repo scan, nightly. Feeds the backlog dashboard.
  full-scan:
    name: Semgrep (full-repo, non-blocking backlog feed)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep:1.174.0
    steps:
      - uses: actions/checkout@c85c95e3d7251135ab7dc9ce3241c5835cc595a9
      - run: semgrep ci
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}