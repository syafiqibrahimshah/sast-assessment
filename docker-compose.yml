services:
  api:
    build: ./services/api
    ports: ["8080:8080"]
    environment:
      - PAYLINK_DB=postgresql://paylink:paylink@db:5432/paylink
      - FLASK_ENV=development
  webhooks:
    build: ./services/webhooks
    ports: ["8081:8081"]
  db:
    image: postgres:15
    environment:
      - POSTGRES_USER=paylink
      - POSTGRES_PASSWORD=paylink
      - POSTGRES_DB=paylink
